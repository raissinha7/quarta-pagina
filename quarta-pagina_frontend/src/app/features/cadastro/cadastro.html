
<div class="login-page auth-container">
  <div class="login">

    <img
      src="/icone-logo-quarta-pagina.png"
      alt="Logo da Biblioteca"
      class="logo-login"
    >

    <h1>Crie sua conta!</h1>

    <p class="subtitulo">
      Preencha seus dados para começar a utilizar a biblioteca.
    </p>

    <form
      (ngSubmit)="cadastrar()"
      autocomplete="off"
    >

      <label for="nome">Nome</label>

      <div class="campo">
        <span><i class="fas fa-user"></i></span>

        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome"
          [(ngModel)]="nome"
          required
        >
      </div>

      <label for="email">E-mail</label>

      <div class="campo">
        <span><i class="fas fa-envelope"></i></span>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Digite seu e-mail"
          [(ngModel)]="email"
          required
        >
      </div>

      <label for="senha">Senha</label>

      <div class="campo">
        <span><i class="fas fa-lock"></i></span>

        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Digite sua senha"
          [(ngModel)]="senha"
          required
        >
      </div>

      <label for="endereco">Endereço</label>

      <div class="campo">
        <span><i class="fas fa-map-marker-alt"></i></span>

        <input
          type="text"
          id="endereco"
          name="endereco"
          placeholder="Digite seu endereço"
          [(ngModel)]="endereco"
          required
        >
      </div>

      <button
        type="submit"
        class="btn-entrar"
      >
        CADASTRAR
      </button>

    </form>
<div class="cadastro">
  Já possui uma conta?

  <button
    type="button"
    (click)="voltarLogin()"
  >
    Entrar
  </button>
</div>

  </div>
</div>
