<div class="container">

  <div class="cadastro-card">

    <h1>Quarta Página</h1>

    <h2>Cadastre-se</h2>

    <p>Crie sua conta para realizar empréstimos.</p>

    <input
      type="text"
      placeholder="Nome"
      [(ngModel)]="nome"
    >

    <input
      type="email"
      placeholder="E-mail"
      [(ngModel)]="email"
    >

    <input
      type="password"
      placeholder="Senha"
      [(ngModel)]="senha"
    >

    <button (click)="cadastrar()">
      Cadastrar
    </button>

    <p>
      Já possui uma conta?
      <a routerLink="/login">Entrar</a>
    </p>

  </div>

</div>
