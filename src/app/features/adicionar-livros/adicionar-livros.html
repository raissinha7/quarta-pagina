<div class="adicionar-container"> 
    <div class="formulario">
        <h1>Adicionar Livro</h1>
        <p>Cadastre um novo livro na biblioteca.</p>
        <form (ngSubmit)="adicionar()">
            <label>Título</label>
            <input type="text" [(ngModel)]="titulo" name="titulo" placeholder="Digite o título"required>
            <label>Autor</label>
            <input type="text" [(ngModel)]="autor" name="autor" placeholder="Digite o autor" required>
            <label>Categoria</label>
            <input type="text" [(ngModel)]="categoria" name="categoria" placeholder="Ex: Programação" required>
            <label>Descrição</label>
            <textarea [(ngModel)]="descricao" name="descricao" placeholder="Digite uma descrição" required></textarea>
            <label>URL da Capa</label>
            <input type="text" [(ngModel)]="capa" name="capa" placeholder="Cole a URL da imagem">
            <button type="submit">Adicionar Livro</button>
        </form>
    </div>
</div>
