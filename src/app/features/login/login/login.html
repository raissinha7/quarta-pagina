<div class="login-page auth-container">
  <div class="login">

    <img
      src="/icone-logo-quarta-pagina.png"
      alt="Logo da Biblioteca"
      class="logo-login"
    >

    <h1>Bem-vindo de volta!</h1>

    <p class="subtitulo">
      Por favor, insira seus dados para continuar.
    </p>

    <form
      (ngSubmit)="entrar()"
      autocomplete="off"
    >

      <label for="email">E-mail</label>

      <div class="campo">
        <span><i class="fas fa-envelope"></i></span>
      
 <input
  type="email"
  id="email"
  name="email"
  placeholder="Digite seu e-mail"
  [(ngModel)]="email"
  autocomplete="off"
  autocapitalize="none"
  spellcheck="false"
  required
>
      </div>

      <label for="senha">Senha</label>

      <div class="campo">
        <span><i class="fas fa-lock"></i></span>

    <input
  type="password"
  id="senha"
  name="senha"
  placeholder="Digite sua senha"
  [(ngModel)]="senha"
  autocomplete="new-password"
  required
>
      </div>

      <button
        type="button"
        class="esqueceu"
        (click)="esqueciSenha()"
      >
        Esqueci minha senha
      </button>

      <button
        type="submit"
        class="btn-entrar"
      >
        ENTRAR
      </button>

    </form>

    <div class="ou">
      <span>OU</span>
    </div>

    <div class="sociais">
      <button
        type="button"
        title="Entrar com Google"
        (click)="loginGoogle()"
      >
        <i class="fab fa-google"></i>
      </button>

      <button
        type="button"
        title="Entrar com Facebook"
        (click)="loginFacebook()"
      >
        <i class="fab fa-facebook-f"></i>
      </button>
    </div>

    <div class="cadastro">
      Não tem uma conta?

      <button
        type="button"
        (click)="cadastrar()"
      >
        Cadastre-se
      </button>
    </div>

    <div class="acesso-admin">
      <span>É administrador?</span>

      <button
        type="button"
        (click)="acessarAdmin()"
      >
        <i class="fas fa-user-shield"></i>
        Acesso do administrador
      </button>
    </div>

  </div>
</div>
