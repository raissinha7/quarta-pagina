<div class="login-page auth-container">
  <div class="login">

    <img
      src="/icone-logo-quarta-pagina.png"
      alt="Logo da Biblioteca"
      class="logo-login"
    >

    <h1>Bem-vindo de volta!</h1>

    <p class="subtitulo">
      insira seus dados para continuar.
    </p>

    <form
      (ngSubmit)="entrar()"
      autocomplete="off"
    >

      <label for="email">E-mail</label>

      <div class="campo">
        <span><i class="fas fa-envelope"></i></span>
      
 <input
  type="email"
  id="email"
  name="email"
  placeholder="Digite seu e-mail"
  [(ngModel)]="email"
  autocomplete="off"
  autocapitalize="none"
  spellcheck="false"
  required
>
      </div>

      <label for="senha">Senha</label>

      <div class="campo">
        <span><i class="fas fa-lock"></i></span>

    <input
  type="password"
  id="senha"
  name="senha"
  placeholder="Digite sua senha"
  [(ngModel)]="senha"
  autocomplete="new-password"
  required
>
      </div>

      <button
        type="button"
        class="esqueceu"
        routerLink="/recuperar-senha"
      >
        Esqueci minha senha
      </button>

      <button
        type="submit"
        class="btn-entrar"
      >
        ENTRAR
      </button>

    </form>

    <div class="ou">
      <span>OU</span>
    </div>

    <div class="sociais">
      <button
        type="button"
        aria-label="Entrar com Google"
        title="Entrar com Google"
        (click)="loginGoogle()"
      >
        <svg class="icone-google" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M43.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11a9.4 9.4 0 0 1-4.1 6.2v5.2h6.7c3.9-3.6 6-9 6-15.4Z"/>
          <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.2c-1.8 1.2-4.1 2-6.8 2-5.2 0-9.6-3.5-11.2-8.2H5.9v5.3A20 20 0 0 0 24 44Z"/>
          <path fill="#FBBC05" d="M12.8 27.7a12 12 0 0 1 0-7.4V15H5.9a20 20 0 0 0 0 18l6.9-5.3Z"/>
          <path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 6 29.5 4 24 4A20 20 0 0 0 5.9 15l6.9 5.3c1.6-4.7 6-8.2 11.2-8.2Z"/>
        </svg>
      </button>

      <button
        type="button"
        aria-label="Entrar com Facebook"
        title="Entrar com Facebook"
        (click)="loginFacebook()"
      >
        <svg class="icone-facebook" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13.5 21v-8.2h2.8l.4-3.2h-3.2v-2c0-.9.3-1.6 1.6-1.6h1.7V3.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.3H7.3v3.2h2.8V21h3.4Z"/>
        </svg>
      </button>
    </div>

    <div class="cadastro">
      Não tem uma conta?

      <button
        type="button"
        (click)="cadastrar()"
      >
        Cadastre-se
      </button>
    </div>

    <div class="acesso-admin">
  <span>É administrador?</span>

  <button
    type="button"
    (click)="acessarAdmin()"
  >
    Acesso do administrador
  </button>
</div>

  </div>
</div>
