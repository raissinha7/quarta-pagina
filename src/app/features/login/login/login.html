<div class="pagina-login">

  <header class="topo">
    <button class="menu">☰</button>
    <span class="logo">BIBLIOTECA</span>
  </header>

  <section class="login">

    <h1>login</h1>
    <p class="boas-vindas">Obrigada por Voltar!</p>

    <div class="campo">
      <span class="icone">♙</span>

      <div>
        <label>Seu email</label>

        <input
          type="email"
          [(ngModel)]="email"
          placeholder="ex: ana@gmail.com"
        >
      </div>
    </div>

    <div class="campo">
      <span class="icone">✉</span>

      <div>
        <label>Senha</label>

        <input
          type="password"
          [(ngModel)]="senha"
          placeholder="Digite sua senha"
        >
      </div>
    </div>

    <button
      class="esqueci"
      type="button"
      (click)="esqueciSenha()"
    >
      Esqueceu seus dados?
    </button>

    <button
      class="btn-entrar"
      type="button"
      (click)="entrar()"
    >
      ENTRAR
    </button>

    <div class="divisor">
      <span></span>
      <p>OU</p>
      <span></span>
    </div>

    <div class="redes">
      <button type="button" (click)="loginGoogle()">G</button>
      <button type="button" (click)="loginFacebook()">f</button>
    </div>

    <div class="cadastro">
      <span>Ainda não tem conta?</span>

      <button type="button" (click)="cadastrar()">
        CADASTRA-SE
      </button>
    </div>

  </section>

</div>
