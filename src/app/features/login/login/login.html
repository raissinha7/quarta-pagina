 <div class="login-page auth-container">
    
    <div class="login">
      
      <!-- NOVA LOGO AQUI -->
      <img src="quarta-pagina-logo-icon.png" alt="Logo da Empresa" class="logo-login">

      <h1>Bem-vindo de volta!</h1>
      <p class="subtitulo">Por favor, insira seus dados para continuar.</p>

      <form (ngSubmit)="entrar()">
      
        <label for="email">E-mail</label>
        <div class="campo">
          <span><i class="fas fa-envelope"></i></span>
          <input type="email" id="email" placeholder="Digite seu e-mail" required>
        </div>

      
        <label for="senha">Senha</label>
        <div class="campo">
          <span><i class="fas fa-lock"></i></span>
          <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>

        <!-- ESQUECI SENHA -->
        <button type="button" class="esqueceu" routerLink="/esqueciSenha">Esqueci minha senha</button>

        <!-- BOTÃO ENTRAR -->
        <button type="submit" class="btn-entrar">ENTRAR</button>
      </form>

      <!-- DIVISOR "OU" -->
      <div class="ou">
        <span>OU</span>
      </div>

      <!-- BOTÕES SOCIAIS -->
      <div class="sociais">
        <button type="button" title="Entrar com Google">
          <i class="fab fa-google"></i>
        </button>
        <button type="button" title="Entrar com Facebook">
          <i class="fab fa-facebook-f"></i>
        </button>
      </div>

      <!-- ÁREA DE CADASTRO -->
      <div class="cadastro">
        Não tem uma conta? <button type="button" routerLink="/cadastro">Cadastre-se</button>
      </div>
      
    </div> <!-- Fim .login -->
    
  </div> <!-- Fim .login-page -->
