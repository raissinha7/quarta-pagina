<!-- Botão que fica fixo na tela para abrir o menu -->
<button
  class="btn-abrir"
  type="button"
  aria-label="Abrir menu"
  [attr.aria-expanded]="menuAberto"
  aria-controls="menu-lateral"
  (click)="toggleMenu()"
>
  <span aria-hidden="true">☰</span>
</button>

<!-- Fundo escuro que aparece quando o menu abre -->
<!-- Ele fecha o menu se clicar nele -->
@if (menuAberto) {
  <div class="overlay" (click)="toggleMenu()"></div>
}

<!-- O Menu Lateral em si -->
<!-- A classe 'aberto' só é adicionada se a variável menuAberto for true -->
<nav id="menu-lateral" class="menu-lateral" [class.aberto]="menuAberto">
  
  <!-- Botão para fechar (X) dentro do menu -->
  <button
    class="btn-fechar"
    type="button"
    aria-label="Fechar menu"
    (click)="toggleMenu()"
  >
    <span aria-hidden="true">×</span>
  </button>

  <ul>
    <li>
      <a routerLink="/cadastro" routerLinkActive="ativo" (click)="toggleMenu()">
        <i class="fas fa-user-plus"></i>
        <span class="texto-menu">Cadastro</span>
      </a>
    </li>
  </ul>
</nav>
