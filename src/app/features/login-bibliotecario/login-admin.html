
<div class="login-page">
  <div class="login">

    <div class="icone-admin">
      <i class="fas fa-user-shield"></i>
    </div>

    <h1>Área do Administrador</h1>

    <p class="subtitulo">
      Entre para gerenciar a biblioteca.
    </p>

    <form (ngSubmit)="entrar()">

      <label for="email">E-mail do administrador</label>

      <div class="campo">
        <span><i class="fas fa-envelope"></i></span>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Digite seu e-mail"
          [(ngModel)]="email"
          required
        >
      </div>

      <label for="senha">Senha</label>

      <div class="campo">
        <span><i class="fas fa-lock"></i></span>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Digite sua senha"
          [(ngModel)]="senha"
          required
        >
      </div>

      <p class="erro" *ngIf="erro">{{ erro }}</p>

      <button type="submit" class="btn-entrar">
        ENTRAR COMO ADMINISTRADOR
      </button>

    </form>

    <button
      type="button"
      class="voltar"
      (click)="voltar()"
    >
      Voltar para o login de leitor
    </button>

  </div>
</div>
