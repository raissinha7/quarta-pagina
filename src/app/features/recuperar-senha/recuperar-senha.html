
<div class="recuperar-page">
  <div class="recuperar-card">

    <img
      src="/icone-logo-quarta-pagina.png"
      alt="Logo da Biblioteca"
      class="logo"
    >

    <h1>Recuperar senha</h1>

    <p class="subtitulo">
      Informe seu e-mail e escolha uma nova senha.
    </p>

    <form (ngSubmit)="salvarSenha()">

      <label for="email">E-mail cadastrado</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Digite seu e-mail"
        [(ngModel)]="email"
        required
      >

      <label for="novaSenha">Nova senha</label>
      <input
        type="password"
        id="novaSenha"
        name="novaSenha"
        placeholder="Digite sua nova senha"
        [(ngModel)]="novaSenha"
        required
      >

      <label for="confirmarSenha">Confirmar nova senha</label>
      <input
        type="password"
        id="confirmarSenha"
        name="confirmarSenha"
        placeholder="Confirme sua nova senha"
        [(ngModel)]="confirmarSenha"
        required
      >

      <button type="submit">
        SALVAR NOVA SENHA
      </button>

    </form>

    <a routerLink="/login">Voltar para o login</a>

  </div>
</div>
