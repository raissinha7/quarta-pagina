<div class="home">

  <header class="topo">
    <span class="menu">☰</span>
    <span class="logo">BIBLIOTECA</span>
    <span class="icone">♡</span>
  </header>

  <section class="boas-vindas">
    <p>Olá!</p>
    <h1>O que você quer ler hoje?</h1>
  </section>

  <div class="busca">
  <span>🔍</span>

  <input
    #termoPesquisa
    type="text"
    placeholder="Buscar um livro..."
    (keyup.enter)="pesquisar(termoPesquisa.value)"
  >

  <button
    type="button"
    (click)="pesquisar(termoPesquisa.value)">
    Pesquisar
  </button>
</div>

  <h3>Categorias</h3>

  <div class="categorias">
    <button>Romance</button>
    <button>Ficção</button>
    <button>Suspense</button>
    <button>Fantasia</button>
    <button>Educação</button>
  </div>

  <div class="banner">
    <h2>Encontre sua próxima leitura</h2>
    <p>Descubra novos livros e histórias incríveis.</p>
  </div>

  <div class="titulo-livros">
    <h3>Livros em destaque</h3>
    <a routerLink="/livros">Ver todos</a>
  </div>

  <div class="livros-destaque">

    <div class="livro">
      <img src="https://covers.openlibrary.org/b/title/The%20Little%20Prince-L.jpg">
      <p>O Pequeno Príncipe</p>
    </div>

    <div class="livro">
      <img src="https://covers.openlibrary.org/b/title/Harry%20Potter-L.jpg">
      <p>Harry Potter</p>
    </div>

    <div class="livro">
      <img src="https://covers.openlibrary.org/b/title/Dom%20Casmurro-L.jpg">
      <p>Dom Casmurro</p>
    </div>

  </div>

</div>
